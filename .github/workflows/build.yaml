name: Build

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  HUSKY: 0

jobs:
  install:
    name: Install package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node
        uses: pplancq/actions/setup-node@745b7a9f48e9670336d693310d022866a0e0da53 # v1.1.0
        with:
          use-mise: 'true'

      - name: Check package-lock.json
        run: npm run package:check

      - name: Install package
        run: npm ci --ignore-scripts

  commitlint:
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'copilot/')
    name: CommitLint
    needs:
      - install
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: pplancq/actions/setup-node@745b7a9f48e9670336d693310d022866a0e0da53 # v1.1.0
        with:
          use-mise: 'true'

      # https://commitlint.js.org/guides/ci-setup.html#github-actions
      - name: Validate PR commits with commitlint
        run: npx commitlint --from ${{ github.event.pull_request.head.sha }}~${{ github.event.pull_request.commits }} --to ${{ github.event.pull_request.head.sha }} --verbose --color

  lint:
    name: Lint code
    needs:
      - install
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node
        uses: pplancq/actions/setup-node@745b7a9f48e9670336d693310d022866a0e0da53 # v1.1.0
        with:
          use-mise: 'true'

      - name: Run eslint
        if: always()
        run: npm run lint:eslint

      - name: Run stylelint
        if: always()
        run: npm run lint:stylelint

      - name: Run prettier
        if: always()
        run: npm run lint:prettier

      - name: Run tsc
        if: always()
        run: npm run lint:tsc

  test:
    name: Test
    needs:
      - install
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node
        uses: pplancq/actions/setup-node@745b7a9f48e9670336d693310d022866a0e0da53 # v1.1.0
        with:
          use-mise: 'true'

      - name: Run unit test
        if: always()
        run: npm run test:unit

      - name: Run e2e test
        if: always()
        run: |
          npm run playwright:install -- chromium
          npm run test:e2e -- --project chromium

      - name: Upload playwright test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-test-results
          retention-days: 10
          path: test-reports/e2e/test-results

      - name: Upload sonar reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sonar-reports
          retention-days: 2
          path: |
            test-reports/unit/coverage/lcov.info
            test-reports/unit/sonar-report.xml
            test-reports/e2e/coverage/lcov-coverage.info
            test-reports/e2e/sonar-results.xml
  sonarcloud:
    name: SonarCloud Scan
    if: always()
    needs:
      - test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Download test reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sonar-reports
          path: test-reports

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build:
    name: Build
    needs:
      - install
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node
        uses: pplancq/actions/setup-node@745b7a9f48e9670336d693310d022866a0e0da53 # v1.1.0
        with:
          use-mise: 'true'

      - name: Run build
        run: npm run build
